spring.application.name=manutd-ai-analyst
spring.main.lazy-initialization=true

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/manutd}
spring.datasource.username=${DATABASE_USERNAME:manutd}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.baseline-on-migrate=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout=${REDIS_TIMEOUT:1s}

football.data.mode=${FOOTBALL_DATA_MODE:mock}
football.api.base-url=${FOOTBALL_API_BASE_URL:https://v3.football.api-sports.io}
football.api.key=${FOOTBALL_API_KEY:}
football.api.max-seasons=${FOOTBALL_API_MAX_SEASONS:5}
football.sync.enabled=${FOOTBALL_SYNC_ENABLED:false}
football.sync.limit=${FOOTBALL_SYNC_LIMIT:20}
football.statistics.sync.enabled=${FOOTBALL_STATISTICS_SYNC_ENABLED:false}
football.statistics.sync.limit=${FOOTBALL_STATISTICS_SYNC_LIMIT:20}

management.health.redis.enabled=false
management.health.db.enabled=false
management.endpoints.web.exposure.include=health
